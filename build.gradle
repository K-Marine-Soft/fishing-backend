plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	//id 'org.owasp.dependencycheck' version '9.0.9'  // ← 추가
}
/*dependencyCheck {
	nvd {
		apiKey ="FB21B7C1-FE74-F111-836F-0EBF96DE670D"
	}
}*/
group = 'com.kmarine'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
}

dependencies {

	// AWS S3
	implementation platform('io.awspring.cloud:spring-cloud-aws-dependencies:3.1.1')
	
	implementation 'io.awspring.cloud:spring-cloud-aws-s3:3.1.1'
	
	// 포트원 (아임포트)
	implementation 'com.github.iamport:iamport-rest-client-java:0.2.23'
		
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

	// HTTP 클라이언트 (포트원 API 호출용)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'
    
    // AWS SDK v2 (R2)
    implementation 'software.amazon.awssdk:s3:2.25.0'
    implementation 'software.amazon.awssdk:auth:2.25.0'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

	// Firebase Admin SDK
	implementation 'com.google.firebase:firebase-admin:9.2.0'

    // DevTools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    
    // Jackson DateTime 지원
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    
    // 암호화
    implementation 'org.springframework.security:spring-security-crypto'
    
    /// Google Authenticator (2FA)
    implementation 'com.warrenstrange:googleauth:1.5.0'
    
	// WebSocket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

bootJar {
    archiveFileName = 'fishing-backend-0.0.1-SNAPSHOT.jar'
    enabled = true
}

jar {
    enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
}

