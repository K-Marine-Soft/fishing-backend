spring:
  application:
    name: fishing-backend
  # AWS S3
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: kmarine-fishing-images
  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/fishing_db
    username: fishing_user
    password: fishing1234!
    driver-class-name: org.postgresql.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: update # create -> update 변경  # 최초 실행 시 테이블 자동 생성
      #   create :삭제후 생성, update : 신규 테이블생성, 컬럼추가시 자동 반영  validate : Entity와 DB 구조 검증만(운영환경) none : 아무것도 안함 ( 운영환경) 
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
  # 첨부용량    
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB      

  # OAuth2 (나중에 실제 키로 교체)
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ef50c887d9cd82882934c1d5c2806371
            client-secret: 4hWu1IZLPgsbW2aWxzkpJadY4oGLx7bZ
            client-authentication-method: client_secret_post # 중요: 이 설정을 꼭 추가하세요
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname #, account_email
          naver:
            client-id: qDfkg0XHeUGFeXUk2pG9
            client-secret: ffpXIFz9vp
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope: name, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

