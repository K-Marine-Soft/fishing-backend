spring:
  application:
    name: fishing-backend
  profiles:
    active: local   # 로컬 실행 시 application-local.yml(gitignore 대상)에서 실제 시크릿 로드. 배포 환경은 SPRING_PROFILES_ACTIVE=prod 로 덮어씀
  web:
    cors:
      allowed-origins: "http://localhost:5173"
      allowed-methods: "*"
      allowed-headers: "*"    
  # AWS S3
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: kmarine-fishing-images
  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/fishing_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: update # create -> update 변경  # 최초 실행 시 테이블 자동 생성
      #   create :삭제후 생성, update : 신규 테이블생성, 컬럼추가시 자동 반영  validate : Entity와 DB 구조 검증만(운영환경) none : 아무것도 안함 ( 운영환경) 
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
  # 첨부용량    
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB      

  # OAuth2 (나중에 실제 키로 교체)
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post # 중요: 이 설정을 꼭 추가하세요
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname #, account_email
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope: name, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000       # 15분 (ms)
  refresh-expiration: 604800000   # 7일 (ms)

# 서버 포트
server:
  port: 8080

# 첨부파일 로컬 저장 (추후 S3로 교체 가능)
file:
  upload-dir: uploads
  base-url: ${FILE_BASE_URL:http://localhost:8080}

# 로그
logging:
  level:
    com.kmarine: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG  # ← 이거 추가
    
# 포트원
portone:
  imp-key: ${PORTONE_IMP_KEY}
  imp-secret: ${PORTONE_IMP_SECRET}
  imp-code: ${PORTONE_IMP_CODE}
  
# 공공데이터 API
ocean:
  api-key: ${OCEAN_API_KEY:temp-key}
  base-url: https://www.khoa.go.kr/api/oceangrid

weather:
  api-key: ${WEATHER_API_KEY:temp-key}
  base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0  